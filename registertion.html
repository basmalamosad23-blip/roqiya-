 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - Bright Future School</title>
    <link rel="stylesheet" href="./contanct.css">
</head>
<body>

<header class="navbar">
    <h2>Bright Future School</h2>
    <nav>
        <a href="./index.html">Home</a>
        <a href="./blog.html">Blog</a>
        <a href="./about.html">About</a>
        <a href="./login.html">Login</a>
        <a href="./registertion.html" class="active">Register</a>
        <a href="./booking.html">Booking</a>
        <a href="./contanct.html">Contact</a>
    </nav>
</header>

<main class="form-container">
    <form class="form-card">
        <h1>Create Account</h1>
        <p class="subtitle">Join our school community</p>

        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter your full name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create a password" required>

        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm" placeholder="Confirm your password" required>

        <button type="submit">Register</button>

        <p class="bottom-text">
            Already have an account?
            <a href="./registratation.html">Login</a>
        </p>
    </form>
</main>

</body>
</html>
