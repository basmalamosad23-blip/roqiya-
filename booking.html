 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Visit - Bright Future School</title>
    <link rel="stylesheet" href="./contanct.css">
</head>
<body>

<header class="navbar">
    <h2>Bright Future School</h2>
    <nav>
      <a href="./index.html">Home</a>
        <a href="./blog.html">Blog</a>
        <a href="./about.html">About</a>
        <a href="./login.html">Login</a>
        <a href="./registertion.html" class="active">Register</a>
        <a href="./booking.html">Booking</a>
        <a href="./contanct.html">Contact</a> 
    </nav>
</header>

<main class="form-container">
    <form class="form-card">
        <h1>Book a School Visit</h1>
        <p class="subtitle">We look forward to welcoming you!</p>

        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter your name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="Enter your phone number" required>

        <label for="date">Visit Date</label>
        <input type="date" id="date" required>

        <label for="visitors">Number of Visitors</label>
        <select id="visitors" required>
            <option value="">Choose number of visitors</option>
            <option value="1">1 Visitor</option>
            <option value="2">2 Visitors</option>
            <option value="3">3 Visitors</option>
            <option value="4">4 Visitors</option>
        </select>

        <button type="submit">Book Now</button>
    </form>
</main>

</body>
</html>
